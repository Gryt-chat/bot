name: Release

# Changesets, the way @gryt/ui does it: a pull request carrying a changeset says what kind of
# change it is, and merging the "Version Packages" PR publishes.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing. Without it no OIDC token is minted and npm falls
  # back to looking for a credential, so a tokenless publish fails as unauthorised.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer, ahead of what Node 24 ships.
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      # Before the publish, because a version cannot be replaced once it is on npm. tsc being
      # happy is not Node being able to load the result — see GRYT-344.
      - name: Check the built package actually loads
        run: |
          node -e "
            import('./dist/index.js').then((m) => {
              const wanted = ['GrytBot', 'loadIdentity', 'createIdentity', 'parseCommand', 'splitArgs', 'PERMISSIONS_BEFORE_CATALOGUE'];
              const missing = wanted.filter((n) => !(n in m));
              if (missing.length) {
                console.error('Missing from the built package:', missing.join(', '));
                process.exit(1);
              }
              console.log('dist exports:', Object.keys(m).sort().join(', '));
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      # The version-bump commit's message, with no skip marker in it: squash-merging puts
      # this message on main, and main is this workflow's only trigger (0.1.1 never shipped).
      - uses: changesets/action@v1
        with:
          publish: yarn release
          title: "Version Packages"
          commit: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
