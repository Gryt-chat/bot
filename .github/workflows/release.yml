name: Release

# Changesets, the way @gryt/ui does it. A pull request that changes the package
# carries a changeset saying what kind of change it is; this collects them into
# a "Version Packages" pull request, and publishes when that is merged.
#
# It replaced a dispatched workflow lifted from @gryt/voice, where you picked
# patch or minor from a dropdown at release time. That suits a package whose
# consumer pins a version deliberately. It does not suit this one: the pull
# request already knew whether it was a breaking change, and asking again days
# later — from a dropdown, with the diff no longer in front of you — is asking
# the same question in the worse place.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing. Without it the OIDC token is never
  # minted and npm falls back to looking for a credential, so a publish that is
  # meant to be tokenless fails as though the token were missing — which is a
  # confusing way to find out.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer, ahead of what Node 24 ships.
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      # Before the publish rather than after it, because a version cannot be
      # replaced once it is on npm. tsc being happy is not the same as Node
      # being able to load the result — @gryt/voice learned that expensively in
      # GRYT-344 — so this imports the real dist the way an installer would.
      - name: Check the built package actually loads
        run: |
          node -e "
            import('./dist/index.js').then((m) => {
              const wanted = ['GrytBot', 'loadIdentity', 'createIdentity', 'parseCommand', 'splitArgs', 'PERMISSIONS_BEFORE_CATALOGUE'];
              const missing = wanted.filter((n) => !(n in m));
              if (missing.length) {
                console.error('Missing from the built package:', missing.join(', '));
                process.exit(1);
              }
              console.log('dist exports:', Object.keys(m).sort().join(', '));
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      - uses: changesets/action@v1
        with:
          publish: yarn release
          title: "Version Packages"
          commit: "release: version packages [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
