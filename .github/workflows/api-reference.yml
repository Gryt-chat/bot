name: API reference

# The bot reference page in `docs` is generated from the doc comments in src,
# so editing one here leaves that page describing something gone.

# Runs the superproject's check here, on the pull request that causes it, rather
# than leaving it to the nightly sweep over there. GRYT-1100.

on:
  pull_request:
    paths:
      - src/**
      - .github/workflows/api-reference.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    uses: Gryt-chat/.github/.github/workflows/api-reference.yml@main
    with:
      component: bot
